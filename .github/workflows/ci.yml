name: CI
on:
  pull_request:
  push:
    branches: [ main, harden/no-mocks-guard ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run no-mocks guard
        shell: pwsh
        run: |
          ./scripts/guard-no-mocks.ps1

      # Optional: fast SSR health check so CI fails if /api/health breaks
      - name: Build (sanity)
        run: pnpm build
