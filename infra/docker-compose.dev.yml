version: '3.8'

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.dev
    env_file: ../apps/api/env.example
    ports:
      - "4000:4000"
    volumes:
      - ../apps/api:/app
      - /app/node_modules
    depends_on: [ais]
    environment:
      - NODE_ENV=development

  ais:
    build:
      context: ../apps/ais
      dockerfile: Dockerfile.dev
    env_file: ../apps/ais/env.example
    ports:
      - "8000:8000"
    volumes:
      - ../apps/ais:/app
      - ../packages/prompt-packs:/app/prompt-packs
    environment:
      - PYTHONPATH=/app

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.dev
    env_file: ../apps/web/env.example
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on: [api]
    environment:
      - NODE_ENV=development

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=amihuman
      - POSTGRES_USER=amihuman
      - POSTGRES_PASSWORD=amihuman
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
